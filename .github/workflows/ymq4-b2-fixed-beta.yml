name: YMQ4 B2 Fixed Beta Baseline

on:
  pull_request:
    paths:
      - '.github/workflows/ymq4-b2-fixed-beta.yml'
      - 'config/ymq4/gold_b2_fixed_beta.v0.1.json'
      - 'docs/architecture/ymq4/YMQ4-B2-*'
      - 'docs/superpowers/specs/*ymq4-b2*'
      - 'docs/superpowers/plans/*ymq4-b2*'
      - 'scripts/ymq4_b2_fixed_beta.py'
      - 'scripts/validate_ymq4_b2.py'
      - 'supabase/migrations/**ymq4_b2**'
      - 'tests/test_ymq4_b2.py'
      - 'tests/test_ymq4_b2_contract.py'
      - 'requirements-dev.txt'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight validates the frozen B2 contract; full materializes the physical fixed-beta baseline'
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - full

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install B2 dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate B2 contract
        run: python scripts/validate_ymq4_b2.py
      - name: B2 unit and database contract tests
        run: python -m unittest tests.test_ymq4_b2 tests.test_ymq4_b2_contract -v

  full-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full' }}
    needs: preflight
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: 'https://tbmoimbdhsrltvospwpu.supabase.co'
      YMQ4_SUPABASE_SECRET_KEY: ${{ secrets.YMQ4_SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install B2 dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Fail closed on missing secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$YMQ4_SUPABASE_SECRET_KEY"
      - name: Materialize fixed-beta baseline and OOS benchmark
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ymq4_b2_fixed_beta.py | tee ymq4-b2-reality-receipt.json
      - name: Require B2_BASELINE_MATERIALIZED_PASS receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          with open('ymq4-b2-reality-receipt.json', encoding='utf-8') as fh:
              receipt = json.load(fh)
          if receipt.get('status') != 'B2_BASELINE_MATERIALIZED_PASS':
              raise SystemExit(f"B2 receipt not PASS: {receipt.get('status')!r}")
          if receipt.get('constraints', {}).get('b3_b7_executed') is not False:
              raise SystemExit('B3-B7 boundary violated')
          if receipt.get('constraints', {}).get('trading_action') is not False:
              raise SystemExit('trading boundary violated')
          PY
      - name: Upload non-secret B2 reality receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ymq4-b2-reality-receipt
          path: ymq4-b2-reality-receipt.json
          retention-days: 30
