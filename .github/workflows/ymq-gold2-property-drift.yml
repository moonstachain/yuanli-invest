name: ymq-gold2-property-drift

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gold2-read-only-reality:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    env:
      SUPABASE_URL: 'https://tbmoimbdhsrltvospwpu.supabase.co'
      YMQ4_SUPABASE_SECRET_KEY: ${{ secrets.YMQ4_SUPABASE_SECRET_KEY }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate constitution
        run: python scripts/ymq_gold2_compiler.py
      - name: Compile accepted YIOS Gold T0 into unified Gold state
        run: python -m scripts.ymq_gold2_converge_yios | tee ymq-gold2-unified-state.json
      - name: Run read-only PIT property-drift diagnostics
        run: python -m scripts.ymq_gold2_property_drift | tee ymq-gold2-property-drift.json
      - name: Run fail-closed 8-regime blind replay core
        run: python -m scripts.ymq_gold2_blind_replay | tee ymq-gold2-blind-replay.json
      - name: Upload non-secret research receipts
        uses: actions/upload-artifact@v4
        with:
          name: ymq-gold2-reality-pack
          path: |
            ymq-gold2-unified-state.json
            ymq-gold2-property-drift.json
            ymq-gold2-blind-replay.json
          if-no-files-found: error
