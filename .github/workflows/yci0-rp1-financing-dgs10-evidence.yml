name: YCI0 RP1 Financing DGS10 Evidence

on:
  pull_request:
    paths:
      - '.github/workflows/yci0-rp1-financing-dgs10-evidence.yml'
      - 'scripts/yci0_rp1_financing_dgs10_archive.py'
      - 'tests/test_yci0_rp1_financing_dgs10_archive.py'
      - 'docs/architecture/yci0_rp1/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  financing-dgs10-raw-evidence:
    runs-on: ubuntu-latest
    env:
      YMQ4_SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.YMQ4_SUPABASE_S3_ACCESS_KEY_ID }}
      YMQ4_SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.YMQ4_SUPABASE_S3_SECRET_ACCESS_KEY }}
      YMQ4_RAW_BUCKET: ymq4-raw-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install archive runtime dependency
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Run pure parsing tests
        run: python -m pytest -q tests/test_yci0_rp1_financing_dgs10_archive.py
      - name: Fail closed on missing S3 secret bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$YMQ4_SUPABASE_S3_ACCESS_KEY_ID"
          test -n "$YMQ4_SUPABASE_S3_SECRET_ACCESS_KEY"
      - name: FRED DGS10 raw source to private S3 and SHA readback
        shell: bash
        run: |
          set -euo pipefail
          python scripts/yci0_rp1_financing_dgs10_archive.py | tee yci0-rp1-financing-dgs10-receipt.json
      - name: Require PASS and zero downstream authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          receipt=json.load(open('yci0-rp1-financing-dgs10-receipt.json'))
          if receipt.get('status') != 'PASS': raise SystemExit('DGS10 raw receipt is not PASS')
          if receipt.get('sha256') != receipt.get('storage_readback_sha256'): raise SystemExit('DGS10 S3 SHA mismatch')
          if len(receipt.get('points') or []) != 4: raise SystemExit('expected four complete-month points')
          if any((receipt.get('authority') or {}).values()): raise SystemExit('authority leakage')
          PY
      - name: Upload non-secret receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: yci0-rp1-financing-dgs10-receipt
          path: yci0-rp1-financing-dgs10-receipt.json
          retention-days: 30
