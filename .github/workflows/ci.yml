name: repository-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      # Validators covered by complete integration tests run with the suite.
      # Keep the remaining historical gates as standalone steps.
      - run: python scripts/validate_q0_architecture.py
      - run: python scripts/validate_m1_theory.py
      - run: python scripts/validate_r0_reframe.py
      - run: python scripts/validate_r1_registry.py
      - run: python scripts/validate_r2_gold_pack.py
      - run: python scripts/validate_r2_1_status.py
      - run: python scripts/build_canon_status.py --check
      - run: python scripts/validate_r2_2_refoundation.py
      - run: python scripts/validate_r2_3_runtime_blockers.py
      - run: python scripts/validate_r2_3a_architecture.py
      - run: python scripts/validate_r2_3a_cross_asset_stress.py
      - run: python scripts/validate_r2_3b0_contract_architecture.py
      - run: python scripts/validate_r2_3b1_p0_specs.py
      - run: python scripts/validate_qxm1_candidate_pack.py
      - run: python scripts/validate_qxm2_post_merge_closure.py
      - run: python scripts/validate_me1_state_object_model.py
      - run: python scripts/validate_yex0_capital_execution_constitution.py
      - run: python scripts/validate_ymq_os0_g1.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v

  governance:
    name: governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/leak_guard.py
      - run: python scripts/check_governance.py
      - run: python scripts/verify_bootstrap_receipt.py
      - run: python scripts/build_manifest.py --check
