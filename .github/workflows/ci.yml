name: repository-gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m scripts.run_checks --scope current

  governance:
    name: governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/leak_guard.py
      - run: python scripts/build_manifest.py --check
      - name: Audit historical assets when touched; always audit releases and manual runs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "push" ]] && [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            python -m scripts.run_checks --scope historical --changed-since "$BASE_SHA"
          else
            python -m scripts.run_checks --scope historical
          fi
