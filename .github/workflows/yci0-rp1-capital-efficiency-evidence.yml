name: YCI0 RP1 Capital Efficiency Evidence

on:
  pull_request:
    paths:
      - '.github/workflows/yci0-rp1-capital-efficiency-evidence.yml'
      - 'scripts/yci0_rp1_capital_efficiency_archive.py'
      - 'runtime/yci0_rp1/capital_efficiency_reconstruction.py'
      - 'config/yci0_rp1/capital_efficiency_entities.v0.1.json'
      - 'config/yci0_rp1/capital_efficiency_contract.v0.1.json'
      - 'docs/architecture/yci0_rp1/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g6-capital-efficiency-evidence:
    runs-on: ubuntu-latest
    env:
      YMQ4_SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.YMQ4_SUPABASE_S3_ACCESS_KEY_ID }}
      YMQ4_SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.YMQ4_SUPABASE_S3_SECRET_ACCESS_KEY }}
      YMQ4_RAW_BUCKET: ymq4-raw-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install archive runtime dependency
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Fail closed on missing S3 secret bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$YMQ4_SUPABASE_S3_ACCESS_KEY_ID"
          test -n "$YMQ4_SUPABASE_S3_SECRET_ACCESS_KEY"
      - name: Archive SEC CompanyFacts and Submissions with SHA readback
        shell: bash
        run: |
          set -euo pipefail
          python scripts/yci0_rp1_capital_efficiency_archive.py | tee yci0-rp1-g6-capital-efficiency-receipt.json
      - name: Require archive PASS and zero downstream authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          with open('yci0-rp1-g6-capital-efficiency-receipt.json', encoding='utf-8') as fh:
              receipt = json.load(fh)
          if receipt.get('status') != 'PASS':
              raise SystemExit('G6 evidence archive receipt is not PASS')
          if receipt.get('archive_mode') != 'PRIVATE_S3_SHA_READBACK':
              raise SystemExit(f"unexpected archive mode: {receipt.get('archive_mode')}")
          auth = receipt.get('authority') or {}
          if any(auth.values()):
              raise SystemExit(f'authority leakage: {auth}')
          rows = receipt.get('archives') or []
          if len(rows) != 8:
              raise SystemExit(f'expected 8 raw archives, got {len(rows)}')
          for row in rows:
              if row.get('sha256') != row.get('storage_readback_sha256'):
                  raise SystemExit(f"SHA readback mismatch: {row.get('entity_id')}/{row.get('kind')}")
          entity_ids = {row.get('entity_id') for row in receipt.get('entities') or []}
          if entity_ids != {'MSFT', 'NVDA', 'ANET', 'ETN'}:
              raise SystemExit(f'entity coverage mismatch: {entity_ids}')
          PY
      - name: Upload non-secret receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: yci0-rp1-g6-capital-efficiency-receipt
          path: yci0-rp1-g6-capital-efficiency-receipt.json
          retention-days: 30
