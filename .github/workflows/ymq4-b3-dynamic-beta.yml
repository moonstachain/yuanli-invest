name: YMQ4 B3 Dynamic Beta Reality Challenge

on:
  pull_request:
    paths:
      - '.github/workflows/ymq4-b3-dynamic-beta.yml'
      - '.ymq4/authorizations/YMQ4-B3-FULL'
      - 'config/ymq4/gold_b3_dynamic_beta.v0.1.json'
      - 'docs/architecture/ymq4/YMQ4-B3-*'
      - 'docs/superpowers/specs/*ymq4-b3*'
      - 'docs/superpowers/plans/*ymq4-b3*'
      - 'scripts/ymq4_b3_dynamic_beta.py'
      - 'scripts/validate_ymq4_b3.py'
      - 'supabase/migrations/**ymq4_b3**'
      - 'tests/test_ymq4_b3.py'
      - 'tests/test_ymq4_b3_contract.py'
      - 'requirements-dev.txt'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight validates frozen B3; full executes the physical dynamic-beta challenge'
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - full

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate B3 contract
        run: python scripts/validate_ymq4_b3.py
      - name: B3 unit and database contract tests
        run: python -m unittest tests.test_ymq4_b3 tests.test_ymq4_b3_contract -v

  full-challenge:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full' }}
    needs: preflight
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: 'https://tbmoimbdhsrltvospwpu.supabase.co'
      YMQ4_SUPABASE_SECRET_KEY: ${{ secrets.YMQ4_SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Fail closed on missing secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$YMQ4_SUPABASE_SECRET_KEY"
      - name: Execute B3 dynamic-beta challenge
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.ymq4_b3_dynamic_beta | tee ymq4-b3-reality-receipt.json
      - name: Require physical PASS receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          with open('ymq4-b3-reality-receipt.json', encoding='utf-8') as fh:
              r = json.load(fh)
          if r.get('status') != 'B3_DYNAMIC_BETA_MATERIALIZED_PASS':
              raise SystemExit(f"B3 physical receipt not PASS: {r.get('status')!r}")
          if r.get('scientific_observation') not in {'DYNAMIC_BETA_BEATS_B2', 'DYNAMIC_BETA_DOES_NOT_BEAT_B2'}:
              raise SystemExit('B3 scientific observation missing')
          if r.get('constraints', {}).get('b4_b7_executed') is not False:
              raise SystemExit('B4-B7 boundary violated')
          if r.get('constraints', {}).get('trading_action') is not False:
              raise SystemExit('trading boundary violated')
          PY
      - name: Upload non-secret B3 receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ymq4-b3-reality-receipt
          path: ymq4-b3-reality-receipt.json
          if-no-files-found: error
          retention-days: 30

  carrier-full:
    if: ${{ github.event_name == 'pull_request' }}
    needs: preflight
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: 'https://tbmoimbdhsrltvospwpu.supabase.co'
      YMQ4_SUPABASE_SECRET_KEY: ${{ secrets.YMQ4_SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check B3 one-shot authorization
        id: auth
        shell: bash
        run: |
          if test -f .ymq4/authorizations/YMQ4-B3-FULL && grep -qx 'AUTHORIZED_YMQ4_B3_FULL_ONCE' .ymq4/authorizations/YMQ4-B3-FULL; then
            echo 'authorized=true' >> "$GITHUB_OUTPUT"
          else
            echo 'authorized=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: ${{ steps.auth.outputs.authorized == 'true' }}
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        if: ${{ steps.auth.outputs.authorized == 'true' }}
        run: python -m pip install -r requirements-dev.txt
      - name: Fail closed on missing secret
        if: ${{ steps.auth.outputs.authorized == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$YMQ4_SUPABASE_SECRET_KEY"
      - name: Execute B3 dynamic-beta challenge
        if: ${{ steps.auth.outputs.authorized == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.ymq4_b3_dynamic_beta | tee ymq4-b3-reality-receipt.json
      - name: Require physical PASS receipt
        if: ${{ steps.auth.outputs.authorized == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          with open('ymq4-b3-reality-receipt.json', encoding='utf-8') as fh:
              r = json.load(fh)
          if r.get('status') != 'B3_DYNAMIC_BETA_MATERIALIZED_PASS':
              raise SystemExit(f"B3 physical receipt not PASS: {r.get('status')!r}")
          if r.get('constraints', {}).get('b4_b7_executed') is not False:
              raise SystemExit('B4-B7 boundary violated')
          if r.get('constraints', {}).get('trading_action') is not False:
              raise SystemExit('trading boundary violated')
          PY
      - name: Upload non-secret B3 receipt
        if: ${{ steps.auth.outputs.authorized == 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ymq4-b3-reality-receipt
          path: ymq4-b3-reality-receipt.json
          if-no-files-found: error
          retention-days: 30
