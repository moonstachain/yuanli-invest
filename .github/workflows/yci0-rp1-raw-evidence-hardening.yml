name: YCI0 RP1 Raw Evidence Hardening

on:
  pull_request:
    paths:
      - '.github/workflows/yci0-rp1-raw-evidence-hardening.yml'
      - 'scripts/yci0_rp1_raw_evidence_archive.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raw-evidence-hardening:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      YMQ4_SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.YMQ4_SUPABASE_S3_ACCESS_KEY_ID }}
      YMQ4_SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.YMQ4_SUPABASE_S3_SECRET_ACCESS_KEY }}
      YMQ4_RAW_BUCKET: ymq4-raw-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install S3 runtime dependency
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Fail closed on missing S3 secret bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$YMQ4_SUPABASE_S3_ACCESS_KEY_ID"
          test -n "$YMQ4_SUPABASE_S3_SECRET_ACCESS_KEY"
      - name: Microsoft raw source → private S3 → SHA readback
        shell: bash
        run: |
          set -euo pipefail
          python scripts/yci0_rp1_raw_evidence_archive.py | tee yci0-rp1-raw-evidence-receipt.json
      - name: Require PASS and zero downstream authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          with open('yci0-rp1-raw-evidence-receipt.json', encoding='utf-8') as fh:
              receipt = json.load(fh)
          if receipt.get('status') != 'PASS':
              raise SystemExit('raw evidence hardening receipt is not PASS')
          auth = receipt.get('authority') or {}
          if any(auth.values()):
              raise SystemExit(f'authority leakage in raw archive receipt: {auth}')
          archived = receipt.get('archived') or []
          if len(archived) != 4:
              raise SystemExit(f'expected four archived quarters, got {len(archived)}')
          for row in archived:
              if row.get('sha256') != row.get('storage_readback_sha256'):
                  raise SystemExit(f"SHA readback mismatch: {row.get('quarter')}")
          PY
      - name: Upload non-secret raw evidence receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: yci0-rp1-raw-evidence-receipt
          path: yci0-rp1-raw-evidence-receipt.json
          retention-days: 30
