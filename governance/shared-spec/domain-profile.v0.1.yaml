schema: yuanli.shared-spec-domain-profile/v0.1
project_id: YIP
domain: investment_research
status: ACTIVE_BINDING_PROFILE
mappings:
  UniversalBootstrap:
    local_surface: docs/architecture/CANON-STATUS.json
    note: Cold start resolves active research canon, runtime authority and frozen/paused lanes.
  MissionBattle:
    local_surface: Research Question -> Theory -> Mechanism -> Hypothesis -> Observable -> ResearchCapability -> Benchmark
  TaskContract:
    local_objects: [ResearchCapability, Benchmark, Runtime, Receipt]
    note: Research tasks remain distinct from broker/live execution.
  HumanAuthorization:
    proposal_surface: provider_contract_or_research_capability_candidate
    authorization_surface: ACT.authorization_state
    runtime_final_pin_is_separate_authority: true
    capital_action_requires_separate_authority: true
  ProviderContract:
    local_provider_roles: [Wind_AI, Codex, quant_workspace, Evidence_Vault]
    provider_ne_semantic_authority: true
  EvolutionCandidate:
    local_rule: repair provider_mapping_runtime_contract gaps before changing investment ontology
non_overrides:
  - Shared Spec does not turn research canon into trade authority.
  - Shared Spec does not authorize broker/live execution.
  - Shared Spec does not change current A9 operational canon.
